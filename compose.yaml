name: 0th

services:
  devnet:
    image: shardlabs/starknet-devnet-rs:0.9.2
    command: ["--port", "5050", "--seed", "0"]
    ports:
      - "5050:5050"
    profiles: [devnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5050/is_alive"]
      interval: 2s
      timeout: 2s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
    depends_on:
      devnet:
        condition: service_healthy
        required: false
    environment:
      RPC_URL: ${SERVICE_RPC_URL:-${RPC_URL:-}}
      PORT: ${PORT:-8787}
      DEVNET: ${DEVNET:-}
      ACCOUNT_CLASS_HASH: ${ACCOUNT_CLASS_HASH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RELAYER_ACCOUNT: ${RELAYER_ACCOUNT:-}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      SEED: ${SEED:-}

  registry:
    build:
      context: .
      dockerfile: registry/Dockerfile
    depends_on:
      devnet:
        condition: service_healthy
        required: false
    environment:
      RPC_URL: ${SERVICE_RPC_URL:-${RPC_URL:-}}
      REGISTRY: ${REGISTRY:-}
      REGISTRY_ADMIN_ACCOUNT: ${REGISTRY_ADMIN_ACCOUNT:-}
      REGISTRY_ADMIN_PRIVATE_KEY: ${REGISTRY_ADMIN_PRIVATE_KEY:-}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_RPC_URL: ${VITE_RPC_URL:-${RPC_URL:-}}
        VITE_SERVER_URL: ${VITE_SERVER_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
        VITE_ADMIN: ${VITE_ADMIN:-${ADMIN:-}}
        VITE_REGISTRY: ${VITE_REGISTRY:-${REGISTRY:-}}
        VITE_VERIFIER: ${VITE_VERIFIER:-${VERIFIER:-}}
        VITE_ACCOUNT_CLASS_HASH: ${VITE_ACCOUNT_CLASS_HASH:-${ACCOUNT_CLASS_HASH:-}}
    ports:
      - "${WEB_PORT:-8080}:8080"
